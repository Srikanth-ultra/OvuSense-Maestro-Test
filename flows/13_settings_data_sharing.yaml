appId: com.fertilityfocus.ovusense3
name: "Settings - Data Sharing and Forgot Password"
---
- clearState
- launchApp
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000

# Login with test@ovusense.com
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "test@ovusense.com"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd

# Wait for main app to fully load
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 30000
- waitForAnimationToEnd

# Wait for bottom navigation to be fully interactive
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_settings"
    timeout: 15000
- waitForAnimationToEnd

# TC-179: Settings > Data Sharing
- runScript:
    file: scripts/tap_settings.js
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Data Sharing"
    timeout: 10000
- tapOn: "Data Sharing"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc179_data_sharing_test

# TC-180: Tap 'Share your data'
- tapOn: "Share your data"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc180_share_data_page
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# TC-157: Settings > Subscriptions > Change subscription email
- tapOn: "Subscriptions"
- waitForAnimationToEnd
- tapOn: "Change subscription email"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc157_change_sub_email
# Dismiss subscription email dialog
- tapOn:
    text: "Cancel"
    optional: true
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Logout for Forgot Password test
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000
- waitForAnimationToEnd

# TC-184: Tap Forgotten Password on Sign in page
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_forgot_password"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc184_forgot_password_popup

# TC-171: Enter email address and tap Forgotten Password in popup
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/forgot_password_email"
    optional: true
- eraseText: 50
- inputText: "test@ovusense.com"
- hideKeyboard
- takeScreenshot: /tmp/ovusense_tc171_forgot_pwd_email_entered

# Tap Cancel to dismiss
- tapOn:
    text: "Cancel"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc171_forgot_pwd_cancelled

# Dismiss any remaining dialog
- back
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc184_back_to_signin

# Login back with original account
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "cg.srikanth1488@gmail.com"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ultra@123"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 30000
- takeScreenshot: /tmp/ovusense_tc_final_login_restored
