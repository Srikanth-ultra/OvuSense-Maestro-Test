appId: com.fertilityfocus.ovusense3
name: "Special Account Tests"
---
- launchApp
- waitForAnimationToEnd

# Logout if already logged in
- swipe:
    start: "972,2200"
    end: "968,2200"
    duration: 200
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000

# ========== high@ovusense.com ==========
# TC-57: Sign in with high@ovusense.com. Confirm cycles display correctly
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "high@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000
- takeScreenshot: /tmp/ovusense_tc57_high_data

# Check Cycles page has no flags
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_title"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc57_high_cycles_no_flags
- back
- waitForAnimationToEnd

# Logout
- swipe:
    start: "972,2200"
    end: "968,2200"
    duration: 200
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000
- waitForAnimationToEnd

# ========== free@ovusense.com ==========
# TC-58: Sign in with free@ovusense.com. Check fertile window
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "free@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000
- takeScreenshot: /tmp/ovusense_tc58_free_data

# Check Medical Profile for Average cycle length
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- tapOn: "Medical Profile"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc58_free_medical_profile
- back
- waitForAnimationToEnd

# Logout
- swipe:
    start: "972,2200"
    end: "968,2200"
    duration: 200
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000
- waitForAnimationToEnd

# ========== prgs@ovusense.com ==========
