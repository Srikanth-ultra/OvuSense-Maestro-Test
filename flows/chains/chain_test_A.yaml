appId: com.fertilityfocus.ovusense3
name: "Chain - test@ Pattern A (07,08,09,11,12,14,18,19,20,21,22,24)"
---
- launchApp
- waitForAnimationToEnd

# Login once with test@ovusense.com
- runFlow:
    file: ../helpers/login_force.yaml
    env:
      EMAIL: "test@ovusense.com"
      PASSWORD: "ovutest?0"

# Flow 07: Data Cycles Test
- runFlow: ../bodies/07_data_cycles_test_body.yaml
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

# Flow 08: Logs Tab Interactions
- runFlow: ../bodies/08_logs_tab_interactions_body.yaml
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

# Flow 09: Settings Preferences Deep
- runFlow: ../bodies/09_settings_preferences_deep_body.yaml
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

# Flow 11: Updates Bug Fixes
- runFlow: ../bodies/11_updates_bugfixes_body.yaml
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

