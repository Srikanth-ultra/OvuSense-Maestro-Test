appId: com.fertilityfocus.ovusense3
name: "Helper - Force logout then login"
---
# Force logout if already logged in
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_settings"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000

# Login with provided credentials
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "${EMAIL}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd

# Dismiss any autofill/save-password prompts after login
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "NO THANKS"
    optional: true

# Wait for main app to load
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 30000

# Dismiss any remaining overlays
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- back:
    optional: true
- waitForAnimationToEnd

# Confirm we're on the main screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 10000
