appId: com.fertilityfocus.ovusense3
name: "Helper - Force logout then login"
---
# Clear app state to force fresh start (avoids unreliable Settings navigation on emulator)
- clearState
- launchApp
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000

# Login with provided credentials
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "${EMAIL}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd

# Wait for main app to fully load
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 30000
- waitForAnimationToEnd

# Wait for bottom navigation to be fully interactive (emulator needs extra settle time)
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_settings"
    timeout: 15000
- waitForAnimationToEnd
