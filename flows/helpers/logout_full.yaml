appId: com.fertilityfocus.ovusense3
name: "Helper - Full logout with autofill dismissal"
---
# Navigate to Settings and logout (best-effort, state is cleared between tests)
- swipe:
    start: "972,2200"
    end: "968,2200"
    duration: 200
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd

# Dismiss autofill save dialog if it appears
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd
