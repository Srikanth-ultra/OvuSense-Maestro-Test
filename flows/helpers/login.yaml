appId: com.fertilityfocus.ovusense3
name: "Helper - Login with provided credentials"
---
# Expects to be on Sign In screen
# Uses env variables: EMAIL, PASSWORD
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "${EMAIL}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd

# Dismiss any autofill/save-password prompts after login
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "NO THANKS"
    optional: true

- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 30000
