appId: com.fertilityfocus.ovusense3
name: "Helper - Logout"
---
# Navigate to Settings and logout (best-effort, state is cleared between tests)
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd
