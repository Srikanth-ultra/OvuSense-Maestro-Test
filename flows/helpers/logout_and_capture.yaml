appId: com.fertilityfocus.ovusense3
name: "Helper - Logout and capture login screen"
---
- launchApp
- waitForAnimationToEnd
- swipe:
    start: "972,2200"
    end: "968,2200"
    duration: 200
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_logout_confirm
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_login_screen
