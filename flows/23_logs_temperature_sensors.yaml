    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc101_temperature_log

# Check for Download button presence
- takeScreenshot: /tmp/ovusense_tc101_download_button_check

# TC-35 STUB: Tap Register (requires physical sensor to complete)
# - tapOn:
#     text: "Register"
#     optional: true
# - waitForAnimationToEnd
# - takeScreenshot: /tmp/ovusense_tc101_register_flow

# TC-36 STUB: Download after recent registration
# (requires physical sensor — popup about downloading after registration)
# - tapOn:
#     text: "Download"
#     optional: true
# - waitForAnimationToEnd
# - takeScreenshot: /tmp/ovusense_tc102_download_warning

# TC-37: Navigate to Me > Sensors to check sensor registration UI
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Sensors"
    direction: DOWN
    timeout: 5000
- tapOn: "Sensors"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc103_me_sensors

# Check for "Register a new OvuSense sensor" option
- tapOn:
    text: "Register.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc103_register_sensor_page

# Go back from sensor registration
- back
- waitForAnimationToEnd

# TC-38/39: Navigate to Settings > Sensors
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Sensors"
    direction: DOWN
    timeout: 5000
- tapOn: "Sensors"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc104_settings_sensors

# Check for "Register a new OvuSense sensor" button
- tapOn:
