    optional: true
- tapOn:
    text: "Register.*sensor.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc104_register_new_sensor

# TC-38/39 STUB: Attempting to register already-registered sensor
# (requires physical sensor — message about sensor already registered)
# Screenshot capture for manual verification
- back
- waitForAnimationToEnd

# TC-27: Temperature log with valid sensors (stub - needs sensor data)
# Navigate back to Logs > Temperature
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc93_temperature_valid_sensor

# Verify Download button is shown
- assertVisible:
    text: "Download"
    optional: true
- takeScreenshot: /tmp/ovusense_tc93_download_visible

# TC-28/29 STUBS: Download OvuCore/OvuFirst data
# (Requires physical sensor nearby - cannot automate without hardware)
# Screenshots capture current state for manual verification

# Logout
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000
- waitForAnimationToEnd
