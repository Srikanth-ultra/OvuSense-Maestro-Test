appId: com.fertilityfocus.ovusense3
name: "Logs - Temperature & Sensor Tests (Stubs)"
---
# NOTE: Many of these tests require physical OvuCore/OvuFirst sensors.
# Steps that require hardware interaction are marked as optional and
# capture screenshots for manual verification.

- launchApp
- waitForAnimationToEnd

# Logout if already logged in
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "LOG OUT"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000

# ============================================================
# TC-32: Amazon purchases link (nosub@ovusense.com)
# ============================================================
# Login with nosub@ovusense.com
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "nosub@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000

# Navigate to Settings > Subscription
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Subscription"
    direction: DOWN
    timeout: 5000
- tapOn: "Subscription"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc98_nosub_subscription

# Tap 'Amazon purchases' link
- tapOn:
    text: "Amazon purchases"
    optional: true
- tapOn:
    text: ".*Amazon.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc98_amazon_page

# Return to app
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Logout nosub
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
    optional: true
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000

# ============================================================
# TC-33: Logs > Temperature for none@ovusense.com
# Check no Download action, Check subscription opens Subscriptions
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "none@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000

# Navigate to Logs tab
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd

# Navigate to Temperature log (swipe to far left, then first item)
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
# Swipe left once to Temperature
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc99_none_temperature

# Verify no 'Download' button visible — capture for manual check
# Tap 'Check subscription' to verify it opens Subscriptions page
- tapOn:
    text: "Check subscription"
    optional: true
- tapOn:
    text: ".*subscription.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc99_none_subscription_page

# Go back
- back
- waitForAnimationToEnd

# Logout none@
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000

# ============================================================
# TC-34: Logs > Temperature for oldsensor@ovusense.com
# Check no Download, only Register a sensor option
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "oldsensor@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000

# Navigate to Logs tab
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd

# Navigate to Temperature log
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
# Swipe left once to Temperature
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc100_oldsensor_temperature

# Verify only Register option visible, no Download
# Screenshot captures the state for manual verification
- takeScreenshot: /tmp/ovusense_tc100_oldsensor_register_only

# Logout oldsensor@
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn: "LOG OUT"
- waitForAnimationToEnd
- tapOn:
    id: "android:id/autofill_save_no"
    optional: true
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000

# ============================================================
# TC-35 to TC-39: Sensor registration tests (STUBS)
# These require physical OvuCore/OvuFirst sensor hardware.
# Below are stub steps that navigate to the sensor registration
# screens and capture screenshots for manual verification.
# ============================================================

# Login with test@ovusense.com for sensor UI exploration
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_email"
- eraseText: 50
- inputText: "test@ovusense.com"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_password"
- eraseText: 50
- inputText: "ovutest?0"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/user_sign_in"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/navigation_data"
    timeout: 20000

# TC-35: Navigate to Logs > Temperature, check Register option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd
# Navigate to Temperature log
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
