appId: com.fertilityfocus.ovusense3
name: "Settings - Forgot Password Flow Tests"
---
- clearState
- launchApp
- waitForAnimationToEnd

# Wait for sign-in screen
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 15000

# ============================================================
# TC-46: Tap Forgotten Password, enter email, tap Cancel
# ============================================================
# Tap Forgotten Password link on the sign-in page
- tapOn:
    text: "Forgot Password?"
    optional: true
- tapOn:
    text: ".*orgot.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc46_forgot_password_popup

# Verify popup appears asking to enter email
# Enter an email address
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_input"
    optional: true
- tapOn:
    id: "android:id/edit"
    optional: true
- inputText: "test@ovusense.com"
- hideKeyboard
- takeScreenshot: /tmp/ovusense_tc46_email_entered

# Tap submit button to trigger reset
- tapOn:
    text: "Forgot Password?"
    optional: true
- tapOn:
    text: ".*orgot.*"
    optional: true
- tapOn:
    text: "Submit"
    optional: true
- tapOn:
    text: "SUBMIT"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc46_password_reset_popup

# Tap Cancel to return to sign-in screen
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "CANCEL"
    optional: true
- back
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc46_back_to_signin

# Verify we're back on sign-in page
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000
- takeScreenshot: /tmp/ovusense_tc46_signin_confirmed

# ============================================================
# TC-47: Tap Forgotten Password again, tap Reset
# ============================================================
- tapOn:
    text: "Forgot Password?"
    optional: true
- tapOn:
    text: ".*orgot.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc47_forgot_password_popup2

# Enter email
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_input"
    optional: true
- tapOn:
    id: "android:id/edit"
    optional: true
- inputText: "test@ovusense.com"
- hideKeyboard

# Tap submit/reset to trigger
- tapOn:
    text: "Forgot Password?"
    optional: true
- tapOn:
    text: ".*orgot.*"
    optional: true
- tapOn:
    text: "Submit"
    optional: true
- tapOn:
    text: "SUBMIT"
    optional: true
- tapOn:
    text: "Reset"
    optional: true
- tapOn:
    text: "RESET"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc47_reset_popup

# Check for confirmation popup and dismiss
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- back
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc47_after_reset

# ============================================================
# TC-48, TC-49, TC-50 (STUBS): External email verification
# These require checking actual email and clicking reset link
# Cannot be automated within the app
# ============================================================
# TC-48 STUB: Check email account receives Password Reset email
- takeScreenshot: /tmp/ovusense_tc48_stub_check_email

# TC-49 STUB: Click reset link and enter new password
- takeScreenshot: /tmp/ovusense_tc49_stub_reset_link

# TC-50 STUB: Sign in with new password
- takeScreenshot: /tmp/ovusense_tc50_stub_signin_new_pw

# Verify we're still on sign-in page
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/user_sign_in"
    timeout: 10000
- takeScreenshot: /tmp/ovusense_tc50_signin_page_final
