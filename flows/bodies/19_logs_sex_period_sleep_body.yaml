appId: com.fertilityfocus.ovusense3
name: "Body - Logs - Sex, Period, Sleep Interactions"
---
# Navigate to Logs tab
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd

# ============================================================
# TC-08: Sex Log - select two or more options, then remove them
# ============================================================
# Navigate to Sex Log via carousel — swipe right to start, then left to Sex
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd
- swipe:
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd

# Now at Logs Selection. Swipe LEFT once to reach first log after selection
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_log_initial

# Swipe LEFT to reach Sex Log (may need 1-2 swipes depending on order)
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_log_view

# Select first sex option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_option1_selected

# Select second sex option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_option2_selected

# Deselect first option (tap again to remove)
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_option1_deselected

# Deselect second option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc74_sex_options_cleared

# ============================================================
# TC-09: Period Log - select one option only, then remove
# ============================================================
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc75_period_log_initial

# Select a period option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc75_period_option_selected

# Try selecting a second option — should replace the first (single-select)
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc75_period_second_option

# Remove the selection by tapping the selected option
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_detail_title"
    index: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc75_period_removed

# ============================================================
# TC-10: Sleep Log - set start and end times
# ============================================================
- swipe:
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc76_sleep_log_initial

# Tap the start time field
- tapOn:
    text: ".*start.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc76_sleep_start_picker

# If a time picker dialog appears, set a time and confirm
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

# Tap the end time field
- tapOn:
    text: ".*end.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc76_sleep_end_picker

# Confirm the end time
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc76_sleep_times_set
