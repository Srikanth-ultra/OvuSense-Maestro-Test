appId: com.fertilityfocus.ovusense3
name: "Body - Data Tab - Cycle Create & Edit (test@)"
---
# ============================================================
# Row 60: Create new 'Medicated - Endometriosis' cycle
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

# Tap cycle title to go to Cycles page
- tapOn:
    text: "Current Cycle.*"
    optional: true
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_title"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_cycles_page

# Look for Create New Cycle button
- scrollUntilVisible:
    element: "Create.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Create.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_create_cycle_page

# Select cycle type - look for Medicated option
- tapOn:
    text: "Medicated.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_medicated_selected

# Look for Endometriosis option
- tapOn:
    text: "Endometriosis"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_endometriosis

# Attempt to set start date (look for date field)
- tapOn:
    text: ".*date.*"
    optional: true
- tapOn:
    text: ".*Date.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_date_set

# Tap Create/Confirm button
- tapOn:
    text: "Create.*"
    optional: true
- tapOn:
    text: "Confirm.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r60_cycle_created

# ============================================================
# Row 61: Check Data page confirms cycle data
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r61_data_verify_created

# ============================================================
# Row 62: Edit cycle to 'IVF - Implantation'
# ============================================================
- tapOn:
    text: "Current Cycle.*"
    optional: true
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_title"
    optional: true
- waitForAnimationToEnd

# Tap the latest cycle to edit
- tapOn:
    text: "Cycle.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r62_cycle_edit_page

# Change type to IVF
- tapOn:
    text: "IVF.*"
    optional: true
- waitForAnimationToEnd

# Select Implantation
- tapOn:
    text: "Implantation"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r62_ivf_implantation

# Confirm change
- tapOn:
    text: "Confirm.*"
    optional: true
- tapOn:
    text: "Update.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r62_cycle_updated

# ============================================================
# Row 63: Check Data page confirms updated info
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r63_data_verify_edited

# ============================================================
# Row 64: Edit cycle to Natural, start 13 days ago
# ============================================================
- tapOn:
    text: "Current Cycle.*"
    optional: true
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_title"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Cycle.*"
    index: 0
    optional: true
- waitForAnimationToEnd

# Change to Natural
- tapOn:
    text: "Natural.*"
    optional: true
- tapOn:
    text: "natural"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r64_natural_selected

# Confirm change
- tapOn:
    text: "Confirm.*"
    optional: true
- tapOn:
    text: "Update.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r64_cycle_natural

# ============================================================
# Row 65: Check Data page - no fertile window shown
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r65_data_no_fertile_window

