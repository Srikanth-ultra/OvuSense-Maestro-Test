appId: com.fertilityfocus.ovusense3
name: "Body - Me Tab - Deep Interaction Tests"
---
# Navigate to Me tab
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc112_me_test_acct

# TC-113: Tap Notifications, check 'Set up notifications' option
- tapOn: "Notifications"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc113_notifications_test

# TC-114: Tap 'Set up notifications'
- tapOn: "Set up notifications"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc114_notification_settings
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Return to Me
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd

# TC-116: Tap Medical Profile, check tapping options opens edit views
- tapOn: "Medical Profile"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc116_medical_profile_test

# Tap Date of birth
- tapOn: "Date of birth"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc116_dob_picker
- back
- waitForAnimationToEnd

# Tap Current tracking goal
- tapOn: "Current tracking goal"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc116_tracking_goal
- back
- waitForAnimationToEnd

# Back to Me
- back
- waitForAnimationToEnd

# TC-117: Medical History - tap Pregnancy/Miscarriage options
- tapOn: "Medical History"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc117_medical_history_test

# TC-106: Tick conditions (Endometriosis, Fibroids) and screenshot
- scrollUntilVisible:
    element: "Endometriosis"
    direction: DOWN
    timeout: 10000
- tapOn: "Endometriosis"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc106_endometriosis_ticked

# Tap Fibroids
- tapOn:
    text: "Fibroids"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc106_fibroids_ticked

# Untick both to restore state
- tapOn: "Endometriosis"
- waitForAnimationToEnd
- tapOn:
    text: "Fibroids"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc106_conditions_restored

# TC-118: Screenshot of Medical History ticks
- takeScreenshot: /tmp/ovusense_tc118_medical_history_ticks
- back
- waitForAnimationToEnd

# TC-119: Personalised Advice - tap various rows
- tapOn: "Personalised Advice"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc119_personalised_advice_test

# TC-120: Scroll through Personalised Advice content
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc120_personalised_advice_scrolled
- back
- waitForAnimationToEnd

# TC-121: Sensors page
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Sensors"
    direction: DOWN
- tapOn: "Sensors"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc121_sensors_test
- back
- waitForAnimationToEnd

# TC-122: Subscriptions - tap Change subscription email
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_me"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Subscriptions"
    direction: DOWN
- tapOn: "Subscriptions"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc122_subscriptions_test

# Tap Change subscription email
- tapOn: "Change subscription email"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc122_change_sub_email

# Dismiss subscription email dialog
- tapOn:
    text: "Cancel"
    optional: true
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
