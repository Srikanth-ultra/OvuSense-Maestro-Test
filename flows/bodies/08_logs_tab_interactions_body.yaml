appId: com.fertilityfocus.ovusense3
name: "Body - Logs Tab - Interaction Tests"
---
# TC-72: Tap Logs tab. Check logs page appears
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_logs"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_tc72_logs_tab

