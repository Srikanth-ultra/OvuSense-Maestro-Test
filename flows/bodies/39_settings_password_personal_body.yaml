appId: com.fertilityfocus.ovusense3
name: "Body - Settings - Password Empty Fields, Personal Details & Notifications (test@)"
---
# ============================================================
# Row 149 (TC-12): Empty old password field
# ============================================================
- tapOn:
    point: "90%,91%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Account"
    timeout: 10000
- tapOn: "Account"
- waitForAnimationToEnd
- tapOn: "Update Password"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.fertilityfocus.ovusense3:id/settings_account_password_old"
    timeout: 10000

# Leave old password empty, enter valid new passwords
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new"
- eraseText: 50
- inputText: "validpass1"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new_confirm"
- eraseText: 50
- inputText: "validpass1"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/button_update"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r149_empty_old_password_error

# Dismiss error
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

# ============================================================
# Row 150 (TC-13): Valid old, empty new password
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_old"
- eraseText: 50
- inputText: "ovutest?0"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new"
- eraseText: 50
# Leave new password empty
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new_confirm"
- eraseText: 50
- inputText: "validpass1"
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/button_update"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r150_empty_new_password_error

- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

# ============================================================
# Row 151 (TC-14): Valid old and new, empty confirm
# ============================================================
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_old"
- eraseText: 50
- inputText: "ovutest?0"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new"
- eraseText: 50
- inputText: "validpass1"
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/settings_account_password_new_confirm"
- eraseText: 50
# Leave confirm empty
- hideKeyboard
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/button_update"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r151_empty_confirm_password_error

- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

# ============================================================
# Row 154-156: Personal Details changes
# ============================================================
# Navigate to Settings > Account > Personal Details
- tapOn:
    point: "90%,91%"
- waitForAnimationToEnd
- tapOn: "Account"
- waitForAnimationToEnd
- tapOn: "Personal Details"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r154_personal_details

# Row 154 (TC-16): Tap Full Name
- tapOn:
    text: "Full Name"
    optional: true
- tapOn:
    text: ".*Name.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r154_full_name_edit

# Dismiss without changing
- back
- waitForAnimationToEnd

# Row 155 (TC-17): Tap Country
- tapOn:
    text: "Country"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r155_country_list

# Dismiss
- back
- waitForAnimationToEnd

# Row 156 (TC-18): Date of Birth
- tapOn:
    text: "Date of Birth"
    optional: true
- tapOn:
    text: ".*birth.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r156_dob_edit

- back
- waitForAnimationToEnd

# ============================================================
# Row 162 (TC-24): Notification toggles
# ============================================================
- tapOn:
    point: "90%,91%"
- waitForAnimationToEnd
- tapOn: "Notifications"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r162_notification_settings

# Toggle first notification type
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_switch_title"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r162_notification_toggled

# Toggle back to restore
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/row_switch_title"
    index: 0
    optional: true
- waitForAnimationToEnd

# ============================================================
# Row 172 (TC-34): Displayed Diagnostic Tests interaction
# ============================================================
- tapOn:
    point: "90%,91%"
- waitForAnimationToEnd
- tapOn: "Preferences"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Select displayed Diagnostic Tests"
    direction: DOWN
    timeout: 10000
- tapOn: "Select displayed Diagnostic Tests"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r172_diagnostic_tests_list

# Toggle an item
- tapOn:
    text: ".*"
    index: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r172_diagnostic_toggled

# Toggle back to restore
- tapOn:
    text: ".*"
    index: 1
    optional: true
- waitForAnimationToEnd

- back
- waitForAnimationToEnd

