appId: com.fertilityfocus.ovusense3
name: "Body - Data Tab - Graph Details & Dual Graph Options (pods@)"
---
# Navigate to Data tab
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/navigation_data"
- waitForAnimationToEnd

# ============================================================
# Row 26: Move graph along timeline, check readings in info bar
# ============================================================
- takeScreenshot: /tmp/ovusense_r26_graph_initial

# Swipe left on graph to scroll timeline backwards
- swipe:
    start: "70%, 50%"
    end: "30%, 50%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r26_timeline_swipe1

- swipe:
    start: "70%, 50%"
    end: "30%, 50%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r26_timeline_swipe2

# Swipe right to move forward
- swipe:
    start: "30%, 50%"
    end: "70%, 50%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r26_timeline_swipe3

# ============================================================
# Row 28: Check ovulation window shading and ovulation lines
# ============================================================
- swipe:
    start: "30%, 50%"
    end: "70%, 50%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r28_ovulation_window

- swipe:
    start: "30%, 50%"
    end: "70%, 50%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r28_ovulation_lines

# ============================================================
# Row 30: Select different dual graph options
# ============================================================

# --- temperature ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_dialog
- tapOn: "temperature"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_temperature

# --- logs ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- tapOn: "logs"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_logs

# --- weight ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- tapOn: "weight"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_weight

# --- period ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- tapOn: "period"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_period

# --- pain ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- tapOn: "pain"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_pain

# --- health ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- tapOn: "health"
- waitForAnimationToEnd
- tapOn: "UPDATE"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_health

# --- Restore combined (already selected by default, just cancel) ---
- tapOn:
    id: "com.fertilityfocus.ovusense3:id/data_graph_type"
- waitForAnimationToEnd
- takeScreenshot: /tmp/ovusense_r30_graph_combined_check
- tapOn: "CANCEL"
- waitForAnimationToEnd

